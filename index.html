    app.innerHTML=`<main class="auth"><section class="auth-visual"><a class="brand"><span class="mark">✳</span><span>lumina<b>.</b></span></a><div class="auth-copy"><small>COLECIONE O QUE TE INSPIRA</small><h1>Ideias que<br>acendem <em>ideias.</em></h1><p>Uma imagem bonita pode ser o começo de muita coisa.</p></div><div class="auth-credit">CORES DE UM DIA LENTO　 ·　 LUMINA STUDIO</div></section><section class="auth-panel"><div class="auth-top"><span>${login?'Já tem uma conta?':'Já faz parte da Lumina?'}</span><button onclick="Lumina.mode('${login?'register':'login'}')">${login?'Criar conta':'Entrar'}</button></div><div class="auth-box"><div class="eyebrow"><i class="dot"></i>${login?'BEM-VINDA DE VOLTA':'SEU ESPAÇO COMEÇA AQUI'}</div><h2>${login?'Entre na Lumina':'Crie sua conta'}</h2><p>${login?'A inspiração que você salvou está esperando.':'Um lugar só seu para descobrir novas ideias.'}</p><form class="auth-form" onsubmit="Lumina.submitAuth(event)">${!login?`<label class="label">Seu nome<input id="auth-name" required placeholder="Como podemos te chamar?" autocomplete="name"></label><div class="role-switch"><button type="button" class="${state.role==='member'?'selected':''}" onclick="Lumina.role('member')">♙　Membro</button><button type="button" class="${state.role==='admin'?'selected':''}" onclick="Lumina.role('admin')">♢　Admin</button></div>${state.role==='admin'?'<label class="label">Código de convite<input id="auth-invite" required placeholder="Convite da equipe"></label>':''}`:''}<label class="label">E-mail<input id="auth-email" type="email" required placeholder="voce@email.com" autocomplete="email"></label><label class="label">Senha<input id="auth-password" type="password" required minlength="${login?'1':'6'}" placeholder="${login?'Sua senha':'Mínimo de 6 caracteres'}" autocomplete="${login?'current-password':'new-password'}"></label><p id="auth-error" class="error" role="alert"></p><button class="auth-submit" type="submit">${login?'Entrar na minha conta':'Criar minha conta'} <span>→</span></button></form><div class="demo-title">ACESSO DE DEMONSTRAÇÃO</div><button class="demo" onclick="Lumina.demo('member')"><strong>◉　Entrar como membro</strong><span>ana@lumina.com</span></button><button class="demo" onclick="Lumina.demo('admin')"><strong>♢　Entrar como admin</strong><span>admin@lumina.com</span></button><p class="legal">As contas e imagens deste protótipo ficam neste navegador.</p></div><footer class="auth-foot"><span>© 2026 LUMINA STUDIO</span><span>FEITO PARA ENCONTRAR</span></footer></section></main>`;
  }
  function renderApp(){
    const admin=state.user.role==='admin', title=state.view==='feed'?'Descobrir':state.view==='search'?'Pesquisar':'Configurações';
    const date=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).format(new Date()).toLocaleUpperCase('pt-BR');
    const photos=state.photos.filter(photo=>(state.category==='Tudo'||photo.category===state.category)&&(!state.query||photo.title.toLocaleLowerCase('pt-BR').includes(state.query.trim().toLocaleLowerCase('pt-BR')))).sort((a,b)=>b.createdAt-a.createdAt);
    app.innerHTML=`<div class="shell"><aside class="side"><a class="brand" onclick="Lumina.go('feed')"><span class="mark">✳</span><span>lumina<b>.</b></span></a><div class="side-label">ESPAÇO CRIATIVO</div><nav class="nav"><button class="${state.view==='feed'?'active':''}" onclick="Lumina.go('feed')"><span>◉</span><span>Feed</span></button><button class="${state.view==='search'?'active':''}" onclick="Lumina.go('search')"><span>⌕</span><span>Pesquisar</span></button><button class="${state.view==='settings'?'active':''}" onclick="Lumina.go('settings')"><span>⚙</span><span>Configurações</span></button></nav><div class="side-bottom">${admin?'<div class="role-tag">♢　Conta administradora</div>':''}<button class="mini-profile" onclick="Lumina.go('settings')"><span class="avatar">${esc(state.user.name.slice(0,1).toUpperCase())}</span><span class="mini-name"><strong>${esc(state.user.name)}</strong><small>${admin?'Administradora':'Membro'}</small></span></button></div></aside><main class="main"><header class="top"><div class="crumb"><span>Início</span><span>›</span><strong>${title}</strong></div><div class="top-actions"><button class="icon-btn" aria-label="Configurações de notificações" onclick="Lumina.go('settings')">♧</button>${admin?'<button class="publish" onclick="Lumina.upload()">＋ Publicar imagem</button>':''}<button class="top-avatar" onclick="Lumina.go('settings')">${esc(state.user.name.slice(0,1).toUpperCase())}</button></div></header><div class="content">${state.view==='feed'?feedView(photos,date):state.view==='search'?searchView(photos):settingsView()}</div></main></div>`;
  }
  function filterView(){return `<div class="filters" role="tablist">${categories.map(cat=>`<button role="tab" aria-selected="${cat===state.category}" class="${cat===state.category?'selected':''}" onclick="Lumina.category('${cat}')">${cat}</button>`).join('')}</div>`}
  function cards(photos){if(!photos.length)return '<div class="empty"><span>⌕</span><strong>Nenhuma imagem por aqui</strong><small>Tente outra busca ou escolha uma categoria diferente.</small></div>';return `<div class="grid">${photos.map(photo=>`<article class="card"><div class="image-wrap"><img src="${esc(photoUrl(photo))}" alt="${esc(photo.title)}" loading="lazy"><div class="overlay"><button class="${state.saved.includes(photo.id)?'saved':''}" onclick="Lumina.favorite('${esc(photo.id)}')" aria-label="Salvar imagem">${state.saved.includes(photo.id)?'✓':'↓'}</button>${state.user.role==='admin'?`<button onclick="Lumina.remove('${esc(photo.id)}')" aria-label="Excluir imagem">×</button>`:''}</div><span class="category">${esc(photo.category)}</span></div><div class="caption"><div><h3>${esc(photo.title)}</h3><small>${esc(photo.author)}</small></div><button class="${state.saved.includes(photo.id)?'saved':''}" onclick="Lumina.favorite('${esc(photo.id)}')" aria-label="Salvar imagem">↓</button></div></article>`).join('')}</div>`}
  function feedView(photos,date){return `<section class="welcome"><div><div class="eyebrow"><i class="dot"></i>${date}</div><h1>Um pouco de <em>inspiração</em><br>para hoje.</h1><p>Ideias bonitas encontram espaço por aqui.</p></div><div class="welcome-note"><span>✳</span>feito para<br>olhar com calma</div></section><section class="section"><div class="section-head"><div><h2>Seu próximo achado</h2><small class="count">${photos.length} inspirações</small></div><button class="text-btn" onclick="Lumina.go('search')">Ver tudo　→</button></div>${filterView()}${cards(photos)}</section>`}
  function searchView(photos){return `<section class="intro"><div class="eyebrow"><i class="dot"></i>EXPLORE A COLEÇÃO</div><h1>Encontre sua <em>referência.</em></h1><p>Pesquise pelo nome da imagem e deixe a curiosidade guiar.</p></section><label class="searchbox">⌕<input id="search-input" autofocus value="${esc(state.query)}" oninput="Lumina.search(this.value)" placeholder="Experimente ‘luz da manhã’"><kbd>Ctrl K</kbd>${state.query?`<button class="icon-btn" onclick="Lumina.search('')">×</button>`:''}</label><div class="search-meta"><span>${state.query?`Resultados para “${esc(state.query)}”`:'Todas as imagens'}</span><strong>${photos.length} ${photos.length===1?'imagem':'imagens'}</strong></div>${filterView()}${cards(photos)}`}
  function settingsView(){return `<section class="settings"><div class="intro"><div class="eyebrow"><i class="dot"></i>SEU ESPAÇO</div><h1>Do seu <em>jeito.</em></h1><p>Cuide dos detalhes da sua experiência na Lumina.</p></div><form class="settings-form" onsubmit="Lumina.saveProfile(event)"><div class="settings-head"><div><h2>Perfil</h2><p>Informações que aparecem na sua conta.</p></div><span class="settings-avatar">${esc(state.user.name.slice(0,1).toUpperCase())}</span></div><label class="label">Nome de exibição<input id="profile-name" required value="${esc(state.user.name)}"></label><label class="label">Endereço de e-mail<input disabled value="${esc(state.user.email)}"></label><div class="account"><span class="account-icon">${state.user.role==='admin'?'♢':'♙'}</span><span><strong>${state.user.role==='admin'?'Conta administradora':'Conta de membro'}</strong><small>${state.user.role==='admin'?'Pode publicar e remover imagens do feed.':'Pode explorar, pesquisar e salvar imagens.'}</small></span></div><div class="divider"></div><div class="notice"><span class="account-icon">♧</span><span><strong>Novidades da Lumina</strong><small>Receber avisos sobre novas inspirações.</small></span><button type="button" class="toggle ${state.user.notifications?'on':''}" aria-pressed="${state.user.notifications}" onclick="Lumina.toggleNotice(this)"><span></span></button></div><div class="settings-footer"><button type="button" class="logout" onclick="Lumina.logout()">↪ Sair da conta</button><button class="primary" type="submit">Salvar alterações</button></div></form></section>`}
  const api={
    mode(value){state.mode=value;render()},role(value){state.role=value;render()},demo(role){const user=role==='admin'?starterUsers[1]:starterUsers[0];document.getElementById('auth-email').value=user.email;document.getElementById('auth-password').value=user.password},
    submitAuth(event){event.preventDefault();const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value;let error='';if(state.mode==='login'){const found=state.users.find(user=>user.email.toLowerCase()===email.toLowerCase()&&user.password===password);if(!found)error='E-mail ou senha não conferem.';else state.user=found}else{const name=document.getElementById('auth-name').value.trim(),invite=document.getElementById('auth-invite')?.value;if(state.role==='admin'&&invite!==inviteCode)error='O código de convite não é válido.';else if(password.length<6)error='A senha precisa ter pelo menos 6 caracteres.';else if(state.users.some(user=>user.email.toLowerCase()===email.toLowerCase()))error='Este e-mail já está cadastrado.';else{state.user={name,email,password,role:state.role,notifications:true};state.users.push(state.user);save('lumina-users',state.users)}}if(error){document.getElementById('auth-error').textContent=error;return}state.view='feed';save('lumina-session',state.user);render()},
    go(view){state.view=view;if(view==='feed')state.query='';render()},category(value){state.category=value;render()},search(value){state.query=value;const pos=document.getElementById('search-input')?.selectionStart;render();const input=document.getElementById('search-input');input?.focus();if(pos!==undefined)input?.setSelectionRange(pos,pos)},favorite(id){state.saved=state.saved.includes(id)?state.saved.filter(item=>item!==id):[...state.saved,id];save('lumina-favorites',state.saved);render()},remove(id){const photo=state.photos.find(item=>item.id===id);if(!photo||!confirm(`Excluir a imagem “${photo.title}” do feed?`))return;state.photos=state.photos.filter(item=>item.id!==id);state.saved=state.saved.filter(item=>item!==id);save('lumina-photos',state.photos);save('lumina-favorites',state.saved);render()},
    upload(){state.uploadImage='';state.uploadName='';app.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="backdrop" onclick="if(event.target===this)Lumina.closeUpload()"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow"><i class="dot"></i>NOVA INSPIRAÇÃO</div><h2>Publicar imagem</h2></div><button class="icon-btn" onclick="Lumina.closeUpload()">×</button></div><form onsubmit="Lumina.publish(event)"><label class="drop" id="drop"><input type="file" accept="image/*" onchange="Lumina.choose(this.files[0])"><span style="font-size:24px">⇧</span><strong>Escolha uma imagem</strong><small>JPG, PNG ou WEBP · até 12 MB</small><span>Procurar arquivo</span></label><div id="file-label"></div><label class="label">Nome da imagem<input id="photo-title" maxlength="70" required placeholder="Ex.: Luz da manhã"></label><label class="label">Categoria<select id="photo-category">${categories.slice(1).map(cat=>`<option>${cat}</option>`).join('')}</select></label><p class="error" id="upload-error"></p><div class="modal-footer"><button class="cancel" type="button" onclick="Lumina.closeUpload()">Cancelar</button><button class="primary" type="submit">Publicar no feed　→</button></div></form></section></div>`);},
    closeUpload(){document.getElementById('backdrop')?.remove()},async choose(file){if(!file)return;if(!file.type.startsWith('image/')){document.getElementById('upload-error').textContent='Escolha um arquivo de imagem.';return}if(file.size>12*1024*1024){document.getElementById('upload-error').textContent='A imagem precisa ter menos de 12 MB.';return}try{const bitmap=await createImageBitmap(file),scale=Math.min(1,1300/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();state.uploadImage=canvas.toDataURL('image/jpeg',.78);state.uploadName=file.name;const drop=document.getElementById('drop');drop.querySelector('img')?.remove();drop.insertAdjacentHTML('afterbegin',`<img src="${state.uploadImage}" alt="Prévia">`);document.getElementById('file-label').innerHTML=`<p style="font-size:10px;color:#648057">✓ ${esc(file.name)}</p>`;document.getElementById('upload-error').textContent=''}catch{document.getElementById('upload-error').textContent='Não foi possível abrir esta imagem.'}},
    publish(event){event.preventDefault();if(!state.uploadImage){document.getElementById('upload-error').textContent='Adicione uma imagem antes de publicar.';return}const photo={id:'photo-'+Date.now(),title:document.getElementById('photo-title').value.trim(),category:document.getElementById('photo-category').value,image:state.uploadImage,author:state.user.name,createdAt:Date.now()};state.photos.unshift(photo);if(!save('lumina-photos',state.photos)){state.photos.shift();document.getElementById('upload-error').textContent='O armazenamento local está cheio. Tente uma imagem menor.';return}this.closeUpload();state.category='Tudo';state.query='';state.view='feed';render()},
    saveProfile(event){event.preventDefault();state.user={...state.user,name:document.getElementById('profile-name').value.trim()};state.users=state.users.map(user=>user.email===state.user.email?state.user:user);save('lumina-users',state.users);save('lumina-session',state.user);render()},toggleNotice(button){state.user={...state.user,notifications:!state.user.notifications};save('lumina-session',state.user);state.users=state.users.map(user=>user.email===state.user.email?state.user:user);save('lumina-users',state.users);button.classList.toggle('on',state.user.notifications);button.setAttribute('aria-pressed',String(state.user.notifications))},logout(){state.user=null;state.mode='login';render()}
  };
  window.Lumina=api;
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&state.user){event.preventDefault();state.view='search';render();document.getElementById('search-input')?.focus()}});
  const renderPage=render;
  render=()=>{renderPage();const footer=app.querySelector('.auth-foot span:first-child');if(footer)footer.textContent='© 2026 GIULIA FOTOS'};
  render();
})();
</script>
</body>
